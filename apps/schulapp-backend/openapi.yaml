openapi: "3.0.3"
info:
  title: SchulApp API
  description: API für die Schulverwaltungs-App
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Lokale Entwicklung

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, first_name, last_name, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, teacher, school_admin, superadmin]
        school_id:
          type: integer
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    RefreshResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, teacher, school_admin, superadmin]
        password:
          type: string
          minLength: 8

    CreateUserRequest:
      type: object
      required: [email, password, first_name, last_name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, teacher, school_admin, superadmin]
        school_id:
          type: integer

    BulkCreateUsersRequest:
      type: object
      required: [users]
      properties:
        users:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/CreateUserRequest"

    BulkCreateUsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    Class:
      type: object
      required: [id, name, school_year]
      properties:
        id:
          type: integer
        name:
          type: string
        school_year:
          type: string
        school_id:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateClassRequest:
      type: object
      required: [name, school_year]
      properties:
        name:
          type: string
        school_year:
          type: string

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
        school_year:
          type: string

    ClassMember:
      type: object
      required: [user_id, email, first_name, last_name, role]
      properties:
        user_id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, teacher, school_admin, superadmin]

    ClassTeacher:
      type: object
      required: [user_id, email, first_name, last_name, is_home_teacher]
      properties:
        user_id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        is_home_teacher:
          type: boolean

    AddMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer

    AddTeacherRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
        is_home_teacher:
          type: boolean

    Subject:
      type: object
      required: [id, name, short]
      properties:
        id:
          type: integer
        name:
          type: string
        short:
          type: string

    CreateSubjectRequest:
      type: object
      required: [name, short]
      properties:
        name:
          type: string
        short:
          type: string

    Substitution:
      type: object
      required: [id, date, period, type]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        period:
          type: integer
        class_id:
          type: integer
        subject_id:
          type: integer
        original_teacher_id:
          type: integer
        sub_teacher_id:
          type: integer
        room:
          type: string
        type:
          type: string
          enum: [substitution, cancellation, room_change, extra]
        note:
          type: string
        created_at:
          type: string
          format: date-time

    CreateSubstitutionRequest:
      type: object
      required: [date, period, type]
      properties:
        date:
          type: string
          format: date
        period:
          type: integer
        class_id:
          type: integer
        subject_id:
          type: integer
        original_teacher_id:
          type: integer
        sub_teacher_id:
          type: integer
        room:
          type: string
        type:
          type: string
          enum: [substitution, cancellation, room_change, extra]
        note:
          type: string

    UpdateSubstitutionRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        period:
          type: integer
        class_id:
          type: integer
        subject_id:
          type: integer
        original_teacher_id:
          type: integer
        sub_teacher_id:
          type: integer
        room:
          type: string
        type:
          type: string
          enum: [substitution, cancellation, room_change, extra]
        note:
          type: string

    Lesson:
      type: object
      required: [id, class_id, subject_id, teacher_id, day_of_week, period]
      properties:
        id:
          type: integer
        class_id:
          type: integer
        subject_id:
          type: integer
        teacher_id:
          type: integer
        day_of_week:
          type: integer
          description: "1=Montag..5=Freitag"
          minimum: 1
          maximum: 5
        period:
          type: integer
        room:
          type: string
        created_at:
          type: string
          format: date-time

    CreateLessonRequest:
      type: object
      required: [subject_id, teacher_id, day_of_week, period]
      properties:
        subject_id:
          type: integer
        teacher_id:
          type: integer
        day_of_week:
          type: integer
          minimum: 1
          maximum: 5
        period:
          type: integer
        room:
          type: string

    UpdateLessonRequest:
      type: object
      properties:
        subject_id:
          type: integer
        teacher_id:
          type: integer
        day_of_week:
          type: integer
          minimum: 1
          maximum: 5
        period:
          type: integer
        room:
          type: string

    # Ein Stundenplan-Slot für eine konkrete Kalenderwoche: die wiederkehrende
    # Lesson, ggf. überlagert von einer Vertretung derselben Woche (gleiches
    # class_id+date+period). type erlaubt der UI, ohne Zusatzlogik zwischen
    # normalem, vertretenem und ausgefallenem Unterricht zu unterscheiden.
    TimetableEntry:
      type: object
      required: [lesson, date, type]
      properties:
        lesson:
          $ref: "#/components/schemas/Lesson"
        date:
          type: string
          format: date
          description: Datum dieses Lesson-Slots in der angefragten Woche
        substitution:
          $ref: "#/components/schemas/Substitution"
        type:
          type: string
          enum: [regular, substituted, cancelled]

    Event:
      type: object
      required: [id, title, start_time, end_time, type]
      properties:
        id:
          type: integer
        title:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        all_day:
          type: boolean
        type:
          type: string
          enum: [holiday, exam, event, other]
        class_id:
          type: integer
        creator_id:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateEventRequest:
      type: object
      required: [title, start_time, end_time, type]
      properties:
        title:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        all_day:
          type: boolean
        type:
          type: string
          enum: [holiday, exam, event, other]
        class_id:
          type: integer

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        all_day:
          type: boolean
        type:
          type: string
          enum: [holiday, exam, event, other]
        class_id:
          type: integer

    FileFolder:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        parent_id:
          type: integer
        class_id:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parent_id:
          type: integer

    File:
      type: object
      required: [id, name, size, mime_type]
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: integer
          format: int64
        mime_type:
          type: string
        uploader_id:
          type: integer
        class_id:
          type: integer
        folder_id:
          type: integer
        created_at:
          type: string
          format: date-time

    ChatChannel:
      type: object
      required: [id, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [direct, class, group]
        class_id:
          type: integer
        created_at:
          type: string
          format: date-time
        unread_count:
          type: integer

    CreateChannelRequest:
      type: object
      required: [type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [direct, class, group]
        class_id:
          type: integer
        member_ids:
          type: array
          items:
            type: integer

    ChatContact:
      type: object
      required: [id, email, first_name, last_name, role]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, teacher, school_admin, superadmin]

    Message:
      type: object
      required: [id, channel_id, sender_id, content, created_at]
      properties:
        id:
          type: integer
        channel_id:
          type: integer
        sender_id:
          type: integer
        content:
          type: string
        file_id:
          type: integer
        created_at:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        file_id:
          type: integer

    Homework:
      type: object
      required: [id, title, due_date, class_id, subject_id, teacher_id]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
        class_id:
          type: integer
        subject_id:
          type: integer
        teacher_id:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateHomeworkRequest:
      type: object
      required: [title, due_date, subject_id]
      properties:
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
        subject_id:
          type: integer

    UpdateHomeworkRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        due_date:
          type: string
          format: date
        subject_id:
          type: integer

    HomeworkSubmission:
      type: object
      required: [id, homework_id, student_id, status]
      properties:
        id:
          type: integer
        homework_id:
          type: integer
        student_id:
          type: integer
        status:
          type: string
          enum: [open, submitted, graded]
        grade:
          type: number
          format: float
        submitted_at:
          type: string
          format: date-time
        graded_at:
          type: string
          format: date-time
        file_id:
          type: integer

    GradeSubmissionRequest:
      type: object
      required: [grade]
      properties:
        grade:
          type: number
          format: float

    School:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateSchoolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, school_id]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        school_id:
          type: integer
        requested_class_id:
          type: integer

    JoinRequest:
      type: object
      required: [id, class_id, student_id, status]
      properties:
        id:
          type: integer
        class_id:
          type: integer
        student_id:
          type: integer
        student_email:
          type: string
        student_first_name:
          type: string
        student_last_name:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        decided_by:
          type: integer
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time

    Membership:
      type: object
      required: [classes, pending]
      properties:
        school:
          $ref: "#/components/schemas/School"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/Class"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/JoinRequest"

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Benutzer anmelden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Erfolgreiche Anmeldung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Ungültige Anmeldedaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Access Token erneuern
      responses:
        "200":
          description: Neuer Access Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Ungültiger oder abgelaufener Refresh Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Abmelden
      responses:
        "204":
          description: Erfolgreich abgemeldet

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Öffentliche Schüler-Registrierung (legt Konto an + optional Beitrittsanfrage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registriert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Ungültige Eingabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: E-Mail bereits vergeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/public/schools:
    get:
      tags: [public]
      summary: Schulen öffentlich auflisten (für Registrierung)
      responses:
        "200":
          description: Schulliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"

  /api/v1/public/classes:
    get:
      tags: [public]
      summary: Klassen einer Schule öffentlich auflisten (für Registrierung)
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Klassenliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"

  /api/v1/schools:
    get:
      tags: [schools]
      summary: Schulen auflisten
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schulliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
    post:
      tags: [schools]
      summary: Schule anlegen (nur superadmin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchoolRequest"
      responses:
        "201":
          description: Schule angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"

  /api/v1/me/membership:
    get:
      tags: [auth]
      summary: Eigene Schul-Zugehörigkeit (Schule, Klassen, offene Anfragen)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Zugehörigkeit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Eigenes Profil abrufen
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Benutzerprofil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [auth]
      summary: Eigenes Profil aktualisieren
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Aktualisiertes Benutzerprofil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users:
    get:
      tags: [users]
      summary: Alle Benutzer auflisten
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Benutzerliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [users]
      summary: Benutzer anlegen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Benutzer angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/bulk:
    post:
      tags: [users]
      summary: Mehrere Benutzer anlegen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateUsersRequest"
      responses:
        "201":
          description: Benutzer angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateUsersResponse"

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Benutzer abrufen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [users]
      summary: Benutzer aktualisieren
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Aktualisierter Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      tags: [users]
      summary: Benutzer löschen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Benutzer gelöscht

  /api/v1/classes:
    get:
      tags: [classes]
      summary: Klassen auflisten
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Klassenliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      tags: [classes]
      summary: Klasse anlegen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
      responses:
        "201":
          description: Klasse angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /api/v1/classes/{id}:
    get:
      tags: [classes]
      summary: Klasse abrufen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Klasse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    patch:
      tags: [classes]
      summary: Klasse aktualisieren
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassRequest"
      responses:
        "200":
          description: Aktualisierte Klasse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    delete:
      tags: [classes]
      summary: Klasse löschen
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Klasse gelöscht

  /api/v1/classes/{id}/members:
    get:
      tags: [classes]
      summary: Klassenmitglieder auflisten
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mitgliederliste
          content:
            application/json:
              schema:
                type: array
                items:
