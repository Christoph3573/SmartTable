<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #0e0e10;
    color: #f5f0e8;
    font-family: 'Fraunces', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(220, 120, 60, 0.18) 0%, transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(80, 110, 140, 0.20) 0%, transparent 55%);
  }

  /* film grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  h1 {
    font-size: clamp(6rem, 28vw, 26rem);
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 0.9;
    position: relative;
    z-index: 2;
    animation: rise 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0;
  }

  h1 em {
    font-style: italic;
    color: #e08b5a;
  }

  /* thin line above */
  .line {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -180%);
    width: 60px;
    height: 1px;
    background: #e08b5a;
    animation: grow 1s 0.3s ease forwards;
    transform-origin: center;
    scale: 0 1;
  }

  /* small caption below */
  .caption {
    position: absolute;
    bottom: 3rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Fraunces', serif;
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade 1s 1.2s forwards;
    color: rgba(245, 240, 232, 0.6);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes grow {
    to { scale: 1 1; }
  }

  @keyframes fade {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="line"></div>
  <h1>t<em>e</em>st</h1>
  <div class="caption">— Seite eins —</div>
</body>
</html>
