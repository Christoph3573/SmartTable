---
- name: Service-User anlegen
  ansible.builtin.user:
    name: schulapp
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Verzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: schulapp
    group: schulapp
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/schulapp/bin, mode: "0750" }
    - { path: /etc/schulapp, mode: "0700" }
    - { path: /var/lib/schulapp/uploads, mode: "0750" }

- name: Binary kopieren
  ansible.builtin.copy:
    src: "{{ backend_binary_src }}"
    dest: /opt/schulapp/bin/schulapp
    owner: schulapp
    group: schulapp
    mode: "0755"
  notify: restart schulapp

- name: .env-Datei templaten
  ansible.builtin.template:
    src: schulapp.env.j2
    dest: /etc/schulapp/schulapp.env
    owner: schulapp
    group: schulapp
    mode: "0600"
  notify: restart schulapp

- name: systemd-Unit templaten
  ansible.builtin.template:
    src: schulapp.service.j2
    dest: /etc/systemd/system/schulapp.service
    mode: "0644"
  notify:
    - daemon-reload
    - restart schulapp

- name: Alle belegten TCP-Ports mit Prozess anzeigen (Debug)
  ansible.builtin.shell: "ss -H -tlnp 2>&1 || true"
  register: all_ports_proc
  changed_when: false

- name: Ports ausgeben
  ansible.builtin.debug:
    var: all_ports_proc.stdout_lines

- name: Laufende Docker-Container anzeigen (Debug)
  ansible.builtin.command: docker ps -a
  register: docker_ps
  changed_when: false
  failed_when: false

- name: Docker-Container ausgeben
  ansible.builtin.debug:
    var: docker_ps.stdout_lines

- name: Service aktivieren und starten
  ansible.builtin.systemd:
    name: schulapp
    enabled: true
    state: started

- name: Handler jetzt ausführen (damit der Smoke-Test frisch gestartete Binary trifft)
  ansible.builtin.meta: flush_handlers

- name: Kurz warten bis der Prozess hochkommt
  ansible.builtin.pause:
    seconds: 2

- name: Service-Status anzeigen (Debug)
  ansible.builtin.command: systemctl status schulapp --no-pager -l
  register: svc_status
  changed_when: false
  failed_when: false

- name: Status ausgeben
  ansible.builtin.debug:
    var: svc_status.stdout_lines

- name: Letzte Logs anzeigen (Debug)
  ansible.builtin.command: journalctl -u schulapp -n 50 --no-pager
  register: svc_logs
  changed_when: false
  failed_when: false

- name: Logs ausgeben
  ansible.builtin.debug:
    var: svc_logs.stdout_lines

- name: Smoke-Test /health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ backend_port }}/health"
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 5
  delay: 2
