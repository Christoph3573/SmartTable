services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schulapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schulapp}
      POSTGRES_DB: ${POSTGRES_DB:-schulapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schulapp} -d ${POSTGRES_DB:-schulapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-schulapp}:${POSTGRES_PASSWORD:-schulapp}@postgres:5432/${POSTGRES_DB:-schulapp}?sslmode=disable
      - up
    volumes:
      - ./apps/schulapp-backend/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  backend:
    build:
      context: ./apps/schulapp-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-schulapp}:${POSTGRES_PASSWORD:-schulapp}@postgres:5432/${POSTGRES_DB:-schulapp}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "8080"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      # Lokal: SchoolConnect per `REST_ADDR=:8081 schoolconnect serve` auf dem
      # Host starten — der Container erreicht ihn via host-gateway.
      SCHOOLCONNECT_BASE_URL: ${SCHOOLCONNECT_BASE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/codeclub-ui
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
