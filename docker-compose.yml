services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schulapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schulapp}
      POSTGRES_DB: ${POSTGRES_DB:-schulapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schulapp} -d ${POSTGRES_DB:-schulapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-schulapp}:${POSTGRES_PASSWORD:-schulapp}@postgres:5432/${POSTGRES_DB:-schulapp}?sslmode=disable
      - up
    volumes:
      - ./apps/schulapp-backend/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  backend:
    build:
      context: ./apps/schulapp-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-schulapp}:${POSTGRES_PASSWORD:-schulapp}@postgres:5432/${POSTGRES_DB:-schulapp}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "8080"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      # SchoolConnect v0.3.0 als Sidecar-Service im Compose-Netz
      # (SC_REQUIRE_TENANT=true). Der Proxy setzt X-SC-Tenant aus der
      # JWT-user_id (pro App-Benutzer isoliert); optional HMAC via
      # SC_TENANT_SHARED_SECRET (muss zum Sidecar passen, sonst leer).
      SCHOOLCONNECT_BASE_URL: ${SCHOOLCONNECT_BASE_URL:-http://schoolconnect:8081}
      SC_TENANT_SHARED_SECRET: ${SC_TENANT_SHARED_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      schoolconnect:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  # SchoolConnect v0.3.0 Multi-Tenant als Sidecar: nur internes Netz
  # (kein ports:, kein host-gateway). Credentials/Sessions liegen in
  # /data (Volume sc_creds), getrennt pro Tenant (JWT-user_id).
  schoolconnect:
    build:
      context: ./apps/schoolconnect
    environment:
      SC_REQUIRE_TENANT: "true"
      SC_TENANT_SHARED_SECRET: ${SC_TENANT_SHARED_SECRET:-}
      LOG_LEVEL: ${SC_LOG_LEVEL:-info}
    volumes:
      - sc_creds:/data
    restart: unless-stopped

  # KI-Lernchat (spaeter): `opencode serve` als eigener Sidecar, nur
  # internes Netz (kein ports:). Das Backend proxied
  # POST /api/v1/integrations/opencode/chat dorthin (Tenant = JWT-user_id).
  # Noch nicht aktiv — erst einkommentieren, wenn apps/opencode/Dockerfile
  # steht und der Backend-Proxy verdrahtet ist.
  # opencode:
  #   build:
  #     context: ./apps/opencode
  #   environment:
  #     OPENCODE_ADDR: ":8082"
  #   volumes:
  #     - opencode_data:/data
  #   restart: unless-stopped

  frontend:
    build:
      context: ./apps/codeclub-ui
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  sc_creds:
  # opencode_data:  # aktivieren zusammen mit dem opencode-Service oben
