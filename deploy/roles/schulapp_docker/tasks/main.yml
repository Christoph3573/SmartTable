---
# Absicherung: falls ein vorheriger apt-Lauf mittendrin abgebrochen ist
# (z.B. Paketkonflikt), dpkg/apt in einen sauberen Zustand bringen bevor
# irgendwas anderes versucht wird.
- name: Angebrochene dpkg-Transaktionen abschließen
  ansible.builtin.command: dpkg --configure -a
  changed_when: false
  failed_when: false

- name: Kaputte apt-Abhängigkeiten reparieren
  ansible.builtin.apt:
    state: fixed
  changed_when: false
  failed_when: false

# Docker kann bereits vorhanden sein (z.B. Docker CE aus dem offiziellen
# docker.com-Repo statt Debians docker.io) — nicht blind drüberinstallieren,
# das kollidiert paketseitig (docker-buildx vs. docker-buildx-plugin), siehe
# roles/postgres_docker/tasks/main.yml.
- name: Prüfen ob Docker schon installiert ist
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Docker installieren (nur falls noch nicht vorhanden)
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  when: docker_check.rc != 0

- name: Docker-Dienst aktivieren
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: IDs von Containern ermitteln, die unsere Zielports blockieren (z.B. Reste von manuellem Testen)
  ansible.builtin.shell: >
    (docker ps -q --filter "publish={{ postgres_host_port }}";
     docker ps -q --filter "publish={{ tunnel_local_port }}") | sort -u
  register: port_blocking_containers
  changed_when: false

- name: Port-blockierende Fremd-Container entfernen
  ansible.builtin.command: "docker rm -f {{ item }}"
  loop: "{{ port_blocking_containers.stdout_lines }}"

- name: Projektverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ schulapp_project_dir }}"
    state: directory
    mode: "0755"
    # Owned by the connecting user (not root) so the synchronize/rsync tasks
    # below can write here without needing sudo - the `synchronize` module
    # shells out to its own `sudo rsync` when become is on, and that spawns a
    # non-interactive SSH session that can't be fed the become password even
    # when ANSIBLE_BECOME_PASS is set for regular become tasks.
    # ansible_user_id (from fact gathering) is used rather than ansible_user,
    # since the SSH login user here comes from ~/.ssh/config on the runner,
    # not an inventory/ansible_user variable, so ansible_user is undefined.
    owner: "{{ ansible_user_id }}"

- name: docker-compose.yml aus Template erzeugen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ schulapp_project_dir }}/docker-compose.yml"
    mode: "0644"

- name: .env-Datei aus Template erzeugen
  ansible.builtin.template:
    src: schulapp.env.j2
    dest: "{{ schulapp_env_file }}"
    mode: "0600"

- name: rsync installieren (für synchronize-Modul)
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Backend-Quellcode kopieren (für Docker-Build + Migrations)
  ansible.posix.synchronize:
    src: "{{ backend_repo_src }}/"
    dest: "{{ schulapp_project_dir }}/backend/"
    rsync_opts:
      - "--exclude=.git"
    delete: true
  become: false

- name: Frontend-Quellcode kopieren (für Docker-Build)
  ansible.posix.synchronize:
    src: "{{ frontend_repo_src }}/"
    dest: "{{ schulapp_project_dir }}/frontend/"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=dist"
    delete: true
  become: false

- name: Alte exited Container aufräumen (migrate-Container etc.)
  ansible.builtin.command: docker container prune -f

- name: Docker-Compose ausführen (bauen + starten)
  community.docker.docker_compose_v2:
    project_src: "{{ schulapp_project_dir }}"
    env_files:
      - "{{ schulapp_env_file }}"
    state: present
    build: always
    recreate: always
  register: compose_result

- name: Warten bis Backend bereit ist (Health-Check)
  ansible.builtin.uri:
    url: "http://localhost:{{ tunnel_local_port }}/api/v1/auth/login"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body: '{"email":"admin@schule.de","password":"admin123"}'
    status_code:
      - 200
      - 401
  register: backend_check
  until: backend_check.status in [200, 401]
  retries: 10
  delay: 3
