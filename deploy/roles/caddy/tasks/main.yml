- name: Install caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
  notify: reload caddy

- name: Zielverzeichnis für die Site anlegen
  ansible.builtin.file:
    path: "{{ caddy_site_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Vorherigen Site-Inhalt leeren (kein Rest von alten Deploys)
  ansible.builtin.file:
    path: "{{ caddy_site_root }}"
    state: "{{ item }}"
    owner: www-data
    group: www-data
    mode: "0755"
  loop: [absent, directory]

- name: Site-Dateien auf den Server kopieren
  ansible.builtin.copy:
    src: "{{ caddy_frontend_src }}"
    dest: "{{ caddy_site_root }}/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"
  notify: reload caddy

- name: Validate caddy config
  ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile
  changed_when: false

- name: Handler jetzt ausführen (Config/Content sofort aktiv)
  ansible.builtin.meta: flush_handlers

- name: Ensure caddy is running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
