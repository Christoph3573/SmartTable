name: Deploy via Jump Host

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

jobs:
  deploy-christoph:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host check
            HostName 127.0.0.1
            Port ${{ secrets.PI_TUNNEL_PORT }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Run Ansible Playbook
        working-directory: deploy
        run: |
          ansible-playbook deploy.yml -i inventory --limit pi-christoph \
            -e backend_repo_src="$GITHUB_WORKSPACE/apps/schulapp-backend" \
            -e frontend_repo_src="$GITHUB_WORKSPACE/apps/codeclub-ui" \
            -e schoolconnect_repo_src="$GITHUB_WORKSPACE/apps/schoolconnect"

  deploy-emanuel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EMANUEL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.EMANUEL_VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host pi-emanuel
            HostName 127.0.0.1
            Port ${{ secrets.EMANUEL_PI_TUNNEL_PORT }}
            User ${{ secrets.EMANUEL_PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Verify SSH connection
        run: ssh -o BatchMode=yes pi-emanuel 'echo connected as $(whoami) on $(hostname)'

      - name: Run Ansible Playbook
        working-directory: deploy
        env:
          # Read as an env var (not -e on the command line) so it never shows
          # up in `ps` output on the runner; ansible-core picks this up automatically.
          ANSIBLE_BECOME_PASS: ${{ secrets.EMANUEL_BECOME_PASS }}
        run: |
          ansible-playbook deploy.yml -i inventory --limit pi-emanuel \
            -e backend_repo_src="$GITHUB_WORKSPACE/apps/schulapp-backend" \
            -e frontend_repo_src="$GITHUB_WORKSPACE/apps/codeclub-ui" \
            -e schoolconnect_repo_src="$GITHUB_WORKSPACE/apps/schoolconnect"
