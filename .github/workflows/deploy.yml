name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI: läuft bei jedem Pull Request und bei jedem Push auf develop/main.
  # Muss grün sein, damit die Deploy-Jobs starten (needs: ci).
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schulapp
          POSTGRES_PASSWORD: schulapp
          POSTGRES_DB: schulapp_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U schulapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/schulapp-backend/go.mod
          cache-dependency-path: apps/schulapp-backend/go.sum

      - name: Migrate test database
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/apps/schulapp-backend/migrations:/migrations" \
            migrate/migrate:v4.18.2 \
            -path /migrations \
            -database "postgres://schulapp:schulapp@127.0.0.1:5434/schulapp_test?sslmode=disable" \
            up

      - name: Backend vet
        working-directory: apps/schulapp-backend
        run: go vet ./...

      - name: Backend tests
        working-directory: apps/schulapp-backend
        env:
          TEST_DATABASE_URL: "postgres://schulapp:schulapp@127.0.0.1:5434/schulapp_test?sslmode=disable"
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/codeclub-ui/package-lock.json

      - name: Frontend build
        working-directory: apps/codeclub-ui
        run: |
          npm ci
          npm run build

  # CD (Dev): nur auf develop und nur wenn CI grün ist.
  deploy-christoph:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host check
            HostName 127.0.0.1
            Port ${{ secrets.PI_TUNNEL_PORT }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Run Ansible Playbook
        working-directory: deploy
        env:
          # API-Key als Env (nicht -e), damit er nie in `ps` auftaucht;
          # ansible liest OPENROUTER_API_KEY direkt als openrouter_api_key.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ansible-playbook deploy.yml -i inventory --limit pi-christoph \
            -e backend_repo_src="$GITHUB_WORKSPACE/apps/schulapp-backend" \
            -e frontend_repo_src="$GITHUB_WORKSPACE/apps/codeclub-ui" \
            -e schoolconnect_repo_src="$GITHUB_WORKSPACE/apps/schoolconnect" \
            -e opencode_repo_src="$GITHUB_WORKSPACE/apps/opencode"

  # CD (Prod): nur auf main und nur wenn CI grün ist.
  deploy-emanuel:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EMANUEL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.EMANUEL_VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host pi-emanuel
            HostName 127.0.0.1
            Port ${{ secrets.EMANUEL_PI_TUNNEL_PORT }}
            User ${{ secrets.EMANUEL_PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Verify SSH connection
        run: ssh -o BatchMode=yes pi-emanuel 'echo connected as $(whoami) on $(hostname)'

      - name: Run Ansible Playbook
        working-directory: deploy
        env:
          # Read as an env var (not -e on the command line) so it never shows
          # up in `ps` output on the runner; ansible-core picks this up automatically.
          ANSIBLE_BECOME_PASS: ${{ secrets.EMANUEL_BECOME_PASS }}
          # API-Key als Env (nicht -e): ansible liest OPENROUTER_API_KEY
          # direkt als Variable openrouter_api_key (gleicher Name, lower-case
          # wird automatisch gemappt). Secret muss in GitHub hinterlegt sein:
          # Settings → Secrets → Actions → OPENROUTER_API_KEY.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ansible-playbook deploy.yml -i inventory --limit pi-emanuel \
            -e backend_repo_src="$GITHUB_WORKSPACE/apps/schulapp-backend" \
            -e frontend_repo_src="$GITHUB_WORKSPACE/apps/codeclub-ui" \
            -e schoolconnect_repo_src="$GITHUB_WORKSPACE/apps/schoolconnect" \
            -e opencode_repo_src="$GITHUB_WORKSPACE/apps/opencode"
