name: Deploy via Jump Host

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host pi-via-vm
            HostName 127.0.0.1
            Port ${{ secrets.PI_TUNNEL_PORT }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Verify SSH key exists
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo " Key file ~/.ssh/id_ed25519 not found"
            exit 1
          fi
          echo "✅Key file exists"
          ls -la ~/.ssh/id_ed25519
          echo "--- Key header ---"
          head -1 ~/.ssh/id_ed25519
          echo "--- Line count ---"
          wc -l ~/.ssh/id_ed25519
          echo "--- Validate key ---"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo " Key is valid" || echo "Key is invalid"
      
      - name: Show resolved SSH config
        run: ssh -G pi-via-vm | grep -E '^(hostname|port|user|proxyjump) '

      - name: Verify SSH connection
        run: ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes pi-via-vm 'echo connected as $(whoami) on $(hostname)'

      - name: Run Ansible Playbook
        working-directory: session-03-webserver-ansible
        run: ansible-playbook deploy.yml -i inventory/hosts
