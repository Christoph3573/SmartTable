name: Deploy via Jump Host

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

jobs:
  deploy-christoph:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: apps/codeclub-ui
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE: ""

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build backend (arm64)
        working-directory: apps/schulapp-backend
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/schulapp-linux-arm64 ./cmd/server

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host check
            HostName 127.0.0.1
            Port ${{ secrets.PI_TUNNEL_PORT }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Run Ansible Playbook
        working-directory: session-03-webserver-ansible
        run: |
          ansible-playbook deploy.yml -i inventory --limit pi-christoph \
            -e backend_binary_src="$GITHUB_WORKSPACE/apps/schulapp-backend/bin/schulapp-linux-arm64" \
            -e backend_repo_src="$GITHUB_WORKSPACE/apps/schulapp-backend" \
            -e caddy_frontend_src="$GITHUB_WORKSPACE/apps/codeclub-ui/dist/"

  deploy-emanuel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: apps/codeclub-ui
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE: ""

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build backend (amd64)
        working-directory: apps/schulapp-backend
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/schulapp-linux-amd64 ./cmd/server

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix community.docker

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EMANUEL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.EMANUEL_VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host pi-emanuel
            HostName 127.0.0.1
            Port ${{ secrets.EMANUEL_PI_TUNNEL_PORT }}
            User ${{ secrets.EMANUEL_PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Verify SSH connection
        run: ssh -o BatchMode=yes pi-emanuel 'echo connected as $(whoami) on $(hostname)'

      - name: Run Ansible Playbook
        working-directory: session-03-webserver-ansible
        run: |
          ansible-playbook deploy.yml -i inventory --limit pi-emanuel \
            -e backend_binary_src="$GITHUB_WORKSPACE/apps/schulapp-backend/bin/schulapp-linux-amd64" \
            -e backend_repo_src="$GITHUB_WORKSPACE/apps/schulapp-backend" \
            -e caddy_frontend_src="$GITHUB_WORKSPACE/apps/codeclub-ui/dist/"
