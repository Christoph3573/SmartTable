name: Deploy via Jump Host

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install ansible.posix

      - name: Setup SSH (key + jump host config)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host codeclub-vm
            HostName ${{ secrets.VM_HOST }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes

          Host pi-via-vm
            HostName 127.0.0.1
            Port ${{ secrets.PI_TUNNEL_PORT }}
            User ${{ secrets.PI_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyJump codeclub-vm
            StrictHostKeyChecking no
          EOF

      - name: Run Ansible playbook
        working-directory: session-03-webserver-ansible
        run: |
          ansible-playbook deploy.yml \
            -i inventory/hosts \
            -e "ansible_host=pi-via-vm" \
            -e "ansible_port=${{ secrets.PI_TUNNEL_PORT }}" \
            -e "ansible_user=${{ secrets.PI_USER }}" \
            -e "ansible_ssh_private_key_file=~/.ssh/id_ed25519" \
            -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
